name: lint-and-smoke

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout + shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck bin/cambiar_fondo.sh install.sh uninstall.sh
      - name: Sintaxis (bash -n)
        run: |
          bash -n bin/cambiar_fondo.sh install.sh uninstall.sh
      - name: Smoke test (--dry-run)
        run: |
          mkdir -p "$HOME/.config/field-house"
          cat > "$HOME/.config/field-house/config.conf" <<EOF
          CARPETA_FONDOS="$GITHUB_WORKSPACE/fondos"
          CIUDAD="CanuelasAR"
          HORA_INICIO_AMANECER="06:00"
          HORA_INICIO_MEDIODIA="10:00"
          HORA_INICIO_ATARDECER="15:00"
          HORA_INICIO_NOCHE="20:00"
          PASOS_TRANSICION=15
          PAUSA_ENTRE_PASOS="0.15"
          ESPERA_INICIAL_SEGUNDOS=0
          REINTENTOS_CLIMA_INICIAL=3
          ESPERA_REINTENTO_CLIMA=60
          EOF
          bash bin/cambiar_fondo.sh --dry-run
          bash bin/cambiar_fondo.sh --version