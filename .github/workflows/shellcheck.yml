name: lint-and-smoke

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout + shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck bin/change_wallpaper.sh install.sh uninstall.sh
      - name: Sintaxis (bash -n)
        run: |
          bash -n bin/change_wallpaper.sh install.sh uninstall.sh
      - name: Tests unitarios (bats)
        run: |
          sudo apt-get install -y bats
          bats tests/change_wallpaper.bats
      - name: Smoke test — modo fijo (config mínima, valores por defecto)
        run: |
          mkdir -p "$HOME/.config/field-house"
          cat > "$HOME/.config/field-house/config.conf" <<EOF
          CARPETA_FONDOS="$GITHUB_WORKSPACE/fondos"
          CIUDAD="CanuelasAR"
          HORA_INICIO_AMANECER="06:00"
          HORA_INICIO_MEDIODIA="10:00"
          HORA_INICIO_ATARDECER="15:00"
          HORA_INICIO_NOCHE="20:00"
          PASOS_TRANSICION=15
          PAUSA_ENTRE_PASOS="0.15"
          ESPERA_INICIAL_SEGUNDOS=0
          REINTENTOS_CLIMA_INICIAL=3
          ESPERA_REINTENTO_CLIMA=60
          EOF
          bash bin/change_wallpaper.sh --dry-run
          bash bin/change_wallpaper.sh --version
      - name: Smoke test — modo auto (salida/puesta real del sol, contra wttr.in)
        run: |
          # A diferencia del test anterior, ejercita MODO_HORARIOS="auto" con
          # conectividad real de los runners de GitHub Actions: cubre el
          # camino feliz de consultar_horarios_sol() (parseo del JSON j1,
          # conversión AM/PM, cálculo de mediodía/noche), que el smoke test
          # de modo fijo no toca en absoluto.
          mkdir -p "$HOME/.config/field-house"
          cat > "$HOME/.config/field-house/config.conf" <<EOF
          CARPETA_FONDOS="$GITHUB_WORKSPACE/fondos"
          CIUDAD="CanuelasAR"
          MODO_HORARIOS="auto"
          HORA_INICIO_AMANECER="06:00"
          HORA_INICIO_MEDIODIA="10:00"
          HORA_INICIO_ATARDECER="15:00"
          HORA_INICIO_NOCHE="20:00"
          PASOS_TRANSICION=15
          PAUSA_ENTRE_PASOS="0.15"
          ESPERA_INICIAL_SEGUNDOS=0
          REINTENTOS_CLIMA_INICIAL=3
          ESPERA_REINTENTO_CLIMA=60
          EOF
          SALIDA=$(bash bin/change_wallpaper.sh --dry-run)
          echo "$SALIDA"
          # Si wttr.in no pudo resolver la ciudad ese día, el script degrada
          # a horarios fijos y lo dice explícitamente; cualquier otro caso
          # debe mostrar la línea "Horarios según el sol: ...".
          if ! echo "$SALIDA" | grep -q "Horarios según el sol:" \
              && ! echo "$SALIDA" | grep -q "no se pudo obtener la salida/puesta del sol"; then
            echo "::error::modo auto no generó ninguno de los dos mensajes esperados (ni horarios del sol ni fallback documentado)"
            exit 1
          fi
      - name: Smoke test — variables nuevas explícitas (MODO_HORARIOS, TTL_CACHE_CLIMA, MAX_LOG_BYTES)
        run: |
          # Cubre validar_configuracion() para las tres variables que el
          # smoke test original omitía (quedaban solo cubiertas por sus
          # valores por defecto, nunca por un valor explícito del usuario).
          mkdir -p "$HOME/.config/field-house"
          cat > "$HOME/.config/field-house/config.conf" <<EOF
          CARPETA_FONDOS="$GITHUB_WORKSPACE/fondos"
          CIUDAD="CanuelasAR"
          MODO_HORARIOS="fijo"
          HORA_INICIO_AMANECER="06:00"
          HORA_INICIO_MEDIODIA="10:00"
          HORA_INICIO_ATARDECER="15:00"
          HORA_INICIO_NOCHE="20:00"
          PASOS_TRANSICION=15
          PAUSA_ENTRE_PASOS="0.15"
          ESPERA_INICIAL_SEGUNDOS=0
          REINTENTOS_CLIMA_INICIAL=3
          ESPERA_REINTENTO_CLIMA=60
          TTL_CACHE_CLIMA=600
          MAX_LOG_BYTES=1048576
          EOF
          bash bin/change_wallpaper.sh --dry-run
      - name: Smoke test — configuración inválida debe fallar (CIUDAD con espacio)
        run: |
          # Confirma que validar_configuracion() realmente detiene la
          # ejecución (exit != 0) ante un valor inválido, en vez de
          # continuar en silencio con un valor que rompería la consulta
          # a wttr.in más adelante.
          mkdir -p "$HOME/.config/field-house"
          cat > "$HOME/.config/field-house/config.conf" <<EOF
          CARPETA_FONDOS="$GITHUB_WORKSPACE/fondos"
          CIUDAD="Buenos Aires"
          HORA_INICIO_AMANECER="06:00"
          HORA_INICIO_MEDIODIA="10:00"
          HORA_INICIO_ATARDECER="15:00"
          HORA_INICIO_NOCHE="20:00"
          PASOS_TRANSICION=15
          PAUSA_ENTRE_PASOS="0.15"
          ESPERA_INICIAL_SEGUNDOS=0
          REINTENTOS_CLIMA_INICIAL=3
          ESPERA_REINTENTO_CLIMA=60
          EOF
          if bash bin/change_wallpaper.sh --dry-run; then
            echo "::error::el script debería haber fallado con CIUDAD inválida ('Buenos Aires') y no lo hizo"
            exit 1
          fi
          echo "OK: el script rechazó correctamente la ciudad inválida."
  powershell-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Parseo AST (sintaxis) de los 3 scripts
        shell: pwsh
        run: |
          # Detecta errores de sintaxis reales (paréntesis/llaves mal
          # cerrados, tipos inválidos, etc.), equivalente a `bash -n` para
          # PowerShell. No ejecuta el código, solo lo parsea.
          $ErrorActionPreference = 'Stop'
          $archivos = @(
            'windows\Change-Wallpaper.ps1',
            'windows\Install.ps1',
            'windows\Uninstall.ps1'
          )
          $huboError = $false
          foreach ($archivo in $archivos) {
            $tokens = $null
            $errores = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $archivo), [ref]$tokens, [ref]$errores
            ) | Out-Null
            if ($errores.Count -gt 0) {
              Write-Host "::error::Errores de sintaxis en $archivo"
              foreach ($e in $errores) { Write-Host "  $($e.Message) (línea $($e.Extent.StartLineNumber))" }
              $huboError = $true
            } else {
              Write-Host "OK: $archivo"
            }
          }
          if ($huboError) { exit 1 }

      - name: PSScriptAnalyzer (lint)
        shell: pwsh
        run: |
          # Severidad Warning y Error detienen el build; Information no.
          # No se apunta a "cero warnings" estricto porque algunas reglas de
          # PSScriptAnalyzer (por ejemplo PSAvoidUsingWriteHost, que acá se
          # usa a propósito para salida con color en consola interactiva)
          # no aplican al estilo de este proyecto; se excluyen explícitamente
          # en vez de silenciarlas por archivo con comentarios repetidos.
          $ErrorActionPreference = 'Stop'
          $excluidas = @('PSAvoidUsingWriteHost')
          $resultados = Invoke-ScriptAnalyzer -Path windows\ -Recurse -Severity Warning, Error -ExcludeRule $excluidas
          if ($resultados) {
            $resultados | Format-Table -AutoSize | Out-String | Write-Host
            Write-Host "::error::PSScriptAnalyzer encontró $($resultados.Count) problema(s)."
            exit 1
          }
          Write-Host "OK: sin hallazgos de PSScriptAnalyzer (severidad Warning/Error)."

      - name: Smoke test — modo fijo (-DryRun)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path "$env:APPDATA\FieldHouse" -Force | Out-Null
          $config = [PSCustomObject]@{
            CarpetaFondos          = "$env:GITHUB_WORKSPACE\fondos"
            Ciudad                 = 'CanuelasAR'
            ModoHorarios            = 'fijo'
            HoraInicioAmanecer     = '06:00'
            HoraInicioMediodia     = '10:00'
            HoraInicioAtardecer    = '15:00'
            HoraInicioNoche        = '20:00'
            EsperaInicialSegundos  = 0
            ReintentosClimaInicial = 3
            EsperaReintentoClima   = 60
            TtlCacheClima          = 600
            MaxLogBytes            = 1048576
          }
          $config | ConvertTo-Json | Set-Content -Path "$env:APPDATA\FieldHouse\config.json" -Encoding UTF8

          & pwsh -NoProfile -File windows\Change-Wallpaper.ps1 -DryRun
          $codigo = $LASTEXITCODE
          if ($codigo -ne 0) {
            Write-Host "::error::Change-Wallpaper.ps1 -DryRun (modo fijo) devolvió exit code $codigo"
            exit 1
          }

          & pwsh -NoProfile -File windows\Change-Wallpaper.ps1 -Version
          $codigo = $LASTEXITCODE
          if ($codigo -ne 0) {
            Write-Host "::error::Change-Wallpaper.ps1 -Version devolvió exit code $codigo"
            exit 1
          }

          & pwsh -NoProfile -File windows\Change-Wallpaper.ps1 -Help | Out-Null
          $codigo = $LASTEXITCODE
          if ($codigo -ne 0) {
            Write-Host "::error::Change-Wallpaper.ps1 -Help devolvió exit code $codigo"
            exit 1
          }

      - name: Smoke test — modo auto (salida/puesta real del sol, contra wttr.in)
        shell: pwsh
        run: |
          # Igual que el equivalente bash del job de Linux: ejercita el
          # camino real de Get-HorariosSol (parseo del JSON j1 de wttr.in,
          # conversión de horas 12h y cálculo de mediodía/noche), con
          # conectividad real de los runners de GitHub Actions.
          $ErrorActionPreference = 'Stop'
          $config = [PSCustomObject]@{
            CarpetaFondos          = "$env:GITHUB_WORKSPACE\fondos"
            Ciudad                 = 'CanuelasAR'
            ModoHorarios            = 'auto'
            HoraInicioAmanecer     = '06:00'
            HoraInicioMediodia     = '10:00'
            HoraInicioAtardecer    = '15:00'
            HoraInicioNoche        = '20:00'
            EsperaInicialSegundos  = 0
            ReintentosClimaInicial = 3
            EsperaReintentoClima   = 60
            TtlCacheClima          = 600
            MaxLogBytes            = 1048576
          }
          $config | ConvertTo-Json | Set-Content -Path "$env:APPDATA\FieldHouse\config.json" -Encoding UTF8

          $salida = & pwsh -NoProfile -File windows\Change-Wallpaper.ps1 -DryRun
          $salida | Write-Host
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Change-Wallpaper.ps1 -DryRun (modo auto) devolvió exit code $LASTEXITCODE"
            exit 1
          }
          $textoCompleto = $salida -join "`n"
          $tieneSol = $textoCompleto -match 'Horarios según el sol:'
          $tieneFallback = $textoCompleto -match 'no se pudo obtener la salida/puesta del sol'
          if (-not $tieneSol -and -not $tieneFallback) {
            Write-Host "::error::modo auto no generó ninguno de los dos mensajes esperados (ni horarios del sol ni fallback documentado)"
            exit 1
          }

      - name: Smoke test — configuración inválida debe fallar (Ciudad con espacio)
        shell: pwsh
        run: |
          # Confirma que Test-Configuracion realmente detiene la ejecución
          # (exit code != 0) ante un valor inválido, igual que el equivalente
          # bash de este mismo chequeo en el job de Linux.
          $ErrorActionPreference = 'Stop'
          $config = [PSCustomObject]@{
            CarpetaFondos          = "$env:GITHUB_WORKSPACE\fondos"
            Ciudad                 = 'Buenos Aires'
            ModoHorarios            = 'fijo'
            HoraInicioAmanecer     = '06:00'
            HoraInicioMediodia     = '10:00'
            HoraInicioAtardecer    = '15:00'
            HoraInicioNoche        = '20:00'
            EsperaInicialSegundos  = 0
            ReintentosClimaInicial = 3
            EsperaReintentoClima   = 60
            TtlCacheClima          = 600
            MaxLogBytes            = 1048576
          }
          $config | ConvertTo-Json | Set-Content -Path "$env:APPDATA\FieldHouse\config.json" -Encoding UTF8

          & pwsh -NoProfile -File windows\Change-Wallpaper.ps1 -DryRun
          $codigo = $LASTEXITCODE
          if ($codigo -eq 0) {
            Write-Host "::error::el script debería haber fallado con Ciudad inválida ('Buenos Aires') y no lo hizo"
            exit 1
          }
          Write-Host "OK: el script rechazó correctamente la ciudad inválida (exit code $codigo)."
          exit 0
